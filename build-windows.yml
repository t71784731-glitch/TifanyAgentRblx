name: Build NovaAgent for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Permite ejecutar manualmente desde la web

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable with PyInstaller
      run: |
        pyinstaller novaagent.spec --clean --noconfirm
    
    - name: Install NSIS
      run: |
        choco install nsis -y
    
    - name: Build installer with NSIS
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
    
    - name: Create portable ZIP
      run: |
        Compress-Archive -Path dist\NovaAgent.exe -DestinationPath NovaAgent-Portable.zip
    
    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: NovaAgent-Windows-Exe
        path: dist/NovaAgent.exe
        retention-days: 30
    
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: NovaAgent-Windows-Installer
        path: NovaAgent-Setup-1.0.0.exe
        retention-days: 30
    
    - name: Upload Portable Version
      uses: actions/upload-artifact@v4
      with:
        name: NovaAgent-Portable
        path: NovaAgent-Portable.zip
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/NovaAgent.exe
          NovaAgent-Setup-1.0.0.exe
          NovaAgent-Portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
